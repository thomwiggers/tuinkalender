name: Publiceer tuinkalender

on:
  push:
    branches: [main]
  # Bouwt (maar publiceert niet) bij pull requests, als controle.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk; lopende runs niet afbreken. Pull requests krijgen
# een eigen groep, zodat ze niet achter een publicatie in de rij staan.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # WeasyPrint heeft Pango/Cairo nodig voor de PDF-rendering.
      - name: Systeemafhankelijkheden
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core

      - name: Python-afhankelijkheden
        run: pip install -r requirements.txt

      - name: Bouwen
        run: |
          python build.py
          python build_print.py

      - name: Controleren dat de print-versie 2 pagina's is
        run: |
          pip install pypdf
          python - <<'PY'
          from pypdf import PdfReader
          n = len(PdfReader("Tuinkalender-print.pdf").pages)
          print(f"{n} pagina's")
          if n != 2:
              raise SystemExit(f"print-versie is {n} pagina's, verwacht 2 "
                               "- pas FS of KTH aan in build_print.py")
          PY

      - name: Site samenstellen
        run: |
          mkdir -p site
          cp tuinkalender.html site/index.html
          cp Tuinkalender-print.pdf site/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot-PR's samenvoegen zodra de bouw hierboven slaagt. Mislukt de
  # bouw, dan wordt deze job overgeslagen en blijft de PR openstaan.
  automerge:
    name: Dependabot-PR samenvoegen
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Squash-merge
        run: gh pr merge "$PR" --squash --match-head-commit "$SHA"
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
      # Een merge met GITHUB_TOKEN start geen push-workflow, dus de publicatie
      # wordt hier met de hand gestart.
      - name: Publicatie starten op main
        run: gh workflow run pages.yml --ref main
