name: Publiceer tuinkalender

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk; lopende runs niet afbreken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # WeasyPrint heeft Pango/Cairo nodig voor de PDF-rendering.
      - name: Systeemafhankelijkheden
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core

      - name: Python-afhankelijkheden
        run: pip install -r requirements.txt

      - name: Bouwen
        run: |
          python build.py
          python build_print.py

      - name: Controleren dat de print-versie 2 pagina's is
        run: |
          pip install pypdf
          python - <<'PY'
          from pypdf import PdfReader
          n = len(PdfReader("Tuinkalender-print.pdf").pages)
          print(f"{n} pagina's")
          if n != 2:
              raise SystemExit(f"print-versie is {n} pagina's, verwacht 2 "
                               "- pas FS of KTH aan in build_print.py")
          PY

      - name: Site samenstellen
        run: |
          mkdir -p site
          cp tuinkalender.html site/index.html
          cp Tuinkalender-print.pdf site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
